name: ai
on:
  push:
    branches: [assets]
    paths: ['tools/ai_prompts.txt']
permissions:
  contents: write
jobs:
  g:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 tools/ai_gen.py; ls -la ai
          git config user.name elova-bot; git config user.email bot@users.noreply.github.com
          git add ai; git commit -m "ai images" || true; git push
