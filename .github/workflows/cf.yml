name: cf
on:
  push:
    branches: [assets]
    paths: ['tools/cf_prompts.txt']
permissions:
  contents: write
jobs:
  g:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python3 tools/cf_gen.py; cat ai/cf_log.txt
          git config user.name elova-bot; git config user.email bot@users.noreply.github.com
          git add ai; git commit -m "cf images" || true; git push
