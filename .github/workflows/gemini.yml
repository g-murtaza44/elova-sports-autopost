name: gemini
on:
  push:
    branches: [assets]
    paths: ['tools/gemini_prompts.txt']
permissions:
  contents: write
jobs:
  g:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 tools/gemini_gen.py; cat ai/gemini_log.txt
          git config user.name elova-bot; git config user.email bot@users.noreply.github.com
          git add ai; git commit -m "gemini images" || true; git push
