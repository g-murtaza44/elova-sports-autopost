name: search
on:
  push:
    branches: [assets]
    paths: ['tools/queries.txt']
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf found; python3 tools/csearch.py
          git config user.name elova-bot; git config user.email bot@users.noreply.github.com
          git add found; git commit -m found || true; git push
