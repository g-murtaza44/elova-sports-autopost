name: records-hour-copies
on:
  push:
    branches: [main]
    paths: ['records/*-1.png','records/*-2.png']
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd records
          for f in *-1.png; do [ -e "$f" ] && cp "$f" "${f%-1.png}-h12.png"; done
          for f in *-2.png; do [ -e "$f" ] && cp "$f" "${f%-2.png}-h20.png"; done
          cd ..; git config user.name elova-bot; git config user.email bot@users.noreply.github.com
          git add records; git commit -m "hour copies for Buffer" || true; git push
