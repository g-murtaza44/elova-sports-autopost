name: hf
on:
  push:
    branches: [assets]
    paths: ['tools/hf_probe.py','tools/hf_gen.py','tools/hf_jobs.txt']
permissions:
  contents: write
jobs:
  g:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q gradio_client
          if [ -f tools/hf_jobs.txt ] && [ -f tools/hf_gen.py ]; then python3 tools/hf_gen.py || true; else python3 tools/hf_probe.py || true; fi
          cat ai/hf_log.txt || true
          git config user.name elova-bot; git config user.email bot@users.noreply.github.com
          git add ai; git commit -m "hf images" || true; git pull --rebase -q; git push
