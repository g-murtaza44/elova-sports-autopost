name: fetch
on:
  push:
    branches: [assets]
    paths: ['.github/workflows/fetch.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p src
          curl -sSfL -A "ElovaSportsBot/1.0 (ghulammurtaza.wa@gmail.com)" -o src/anton_full.jpg "https://upload.wikimedia.org/wikipedia/commons/c/cd/2026_Chinese_GP_-_Mercedes_-_Kimi_Antonelli_-_Post_Race_Celebration.jpg" || echo fail; sleep 3
          curl -sSfL -A "ElovaSportsBot/1.0 (ghulammurtaza.wa@gmail.com)" -o src/havertz.jpg "https://upload.wikimedia.org/wikipedia/commons/7/74/1_kai_havertz_2026_%28cropped%29.jpg" || echo fail

          ls -la src
          git config user.name elova-bot; git config user.email bot@users.noreply.github.com
          git add src; git commit -m "fetched photos" || true; git push
