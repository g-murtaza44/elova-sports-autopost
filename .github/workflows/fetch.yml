name: fetch
on:
  push:
    branches: [assets]
    paths: ['.github/workflows/fetch.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p src
          curl -sSfL -A "ElovaSportsBot/1.0 (ghulammurtaza.wa@gmail.com)" -o src/contreras_hi.jpg "https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/William_Contreras_1_61824.jpg/1920px-William_Contreras_1_61824.jpg" || echo "fail contreras"; sleep 3

          ls -la src
          git config user.name elova-bot; git config user.email bot@users.noreply.github.com
          git add src; git commit -m "fetched photos" || true; git push
